
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فصول الجزء الثاني - فلهلا</title>
    <style>
        /* ثيم فلهلا المظلم باللمسة القرمزية */
        body {
            background-color: #030303;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* زر الرجوع */
        .back-btn {
            display: inline-flex;
            align-items: center;
            color: #dc143c;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .back-btn:hover {
            transform: translateX(5px);
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px rgba(220, 20, 60, 0.4);
        }

        /* شريط البحث */
        .search-container {
            margin-bottom: 25px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            background-color: #0f0f0f;
            border: 1px solid #222;
            border-radius: 8px;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-input:focus {
            border-color: #dc143c;
            box-shadow: 0 0 15px rgba(220, 20, 60, 0.3), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* قائمة الفصول */
        .chapters-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* كرت الفصل */
        .chapter-card {
            background: linear-gradient(135deg, #121212, #070707);
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            transition: border-color 0.3s ease;
        }

        .chapter-card:hover {
            border-color: #dc143c;
        }

        /* رأس الفصل القابل للضغط */
        .chapter-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background-color: #0f0f0f;
            transition: background-color 0.3s ease;
        }

        .chapter-header:hover {
            background-color: #161616;
        }

        .chapter-title {
            font-size: 17px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
        }

        .status-icon {
            font-size: 14px;
            color: #dc143c;
            transition: transform 0.3s ease;
        }

        /* محتوى الفصل المخفي */
        .chapter-content {
            display: none;
            padding: 20px;
            border-top: 1px solid #1a1a1a;
            background-color: #080808;
            font-size: 16px;
            line-height: 1.8;
            color: #d1d1d1;
            white-space: pre-line;
        }

        /* الحالة المفتوحة */
        .chapter-card.active .status-icon {
            transform: rotate(-90deg);
        }

        .chapter-card.active .chapter-content {
            display: block;
        }

        .no-results {
            display: none;
            color: #666;
            text-align: center;
            margin-top: 30px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <a href="novels.html" class="back-btn">◀ العودة لقسم الروايات</a>

        <h1>📖 قائمه فصول:فلهلا حرب الأمم</h1>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن رقم أو عنوان الفصل...">
        </div>

        <div class="chapters-list" id="chaptersList">
            
            <!-- الفصل الأول -->
            <div class="chapter-card">
                <div class="chapter-header" onclick="toggleChapter(this)">
                    <span class="chapter-title">الفصل الاول: تلقي مساعده</span>
                    <span class="status-icon">◀</span>
                </div>
                <div class="chapter-content">
                    قريباً 
                </div>
            </div>

            <!-- الفصل الثاني -->
            <div class="chapter-card">
                <div class="chapter-header" onclick="toggleChapter(this)">
                    <span class="chapter-title">الفصل الثاني: قريباً</span>
                    <span class="status-icon">◀</span>
                </div>
                <div class="chapter-content">
                    قريباً 
                </div>
            </div>

        </div>

        <div class="no-results" id="noResults">لم يتم العثور على فصول بهذا الاسم.</div>

    </div>

    <script>
        function toggleChapter(headerElement) {
            const card = headerElement.parentElement;
            card.classList.toggle('active');
        }

        const searchInput = document.getElementById('searchInput');
        const chapterCards = document.querySelectorAll('.chapter-card');
        const noResults = document.getElementById('noResults');

        searchInput.addEventListener('input', function() {
            const filter = searchInput.value.trim().toLowerCase();
            let hasVisibleCard = false;

            chapterCards.forEach(card => {
                const title = card.querySelector('.chapter-title').textContent.toLowerCase();
                if (title.includes(filter)) {
                    card.style.display = 'block';
                    hasVisibleCard = true;
                } else {
                    card.style.display = 'none';
                }
            });

            if (hasVisibleCard) {
                noResults.style.display = 'none';
            } else {
                noResults.style.display = 'block';
            }
        });
    </script>

</body>
</html>
