<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رواية فلهلا - المنصة الرسمية</title>
    <style>
        /* ثيم فلهلا المظلم */
        body {
            background-color: #030303; 
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .logo-container {
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 100%;
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 255, 127, 0.25)); 
        }

        .sections-menu {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
        }

        .menu-btn {
            background: linear-gradient(135deg, #121212, #0a0a0a);
            border: 1px solid #1a1a1a;
            color: #ffffff;
            padding: 20px 24px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 6px; 
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 8px 20px rgba(0,0,0,0.7);
        }

        .menu-btn:hover {
            transform: scale(1.02);
            border-color: #00ff7f; 
            box-shadow: 0 0 25px rgba(0, 255, 127, 0.35), inset 0 0 10px rgba(0, 255, 127, 0.1);
            background: #111111;
        }

        .menu-btn span.arrow {
            color: #00ff7f;
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0, 255, 127, 0.5);
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- استدعاء اللوجو المحلي المسمى logo.png مباشرة باستخدام مسار نسبي نقّي -->
        <div class="logo-container">
            <img src="./logo.png" alt="Falhela" class="logo">
        </div>

        <nav class="sections-menu">
            <a href="novels.html" class="menu-btn">
                <span>📚 قسم الروايات</span>
                <span class="arrow">◀</span>
            </a>
            <a href="characters.html" class="menu-btn">
                <span>👤 بطاقات الشخصيات</span>
                <span class="arrow">◀</span>
            </a>
            <a href="definitions.html" class="menu-btn">
                <span>📑 موسوعة التعريفات</span>
                <span class="arrow">◀</span>
            </a>
            <a href="music.html" class="menu-btn">
                <span>🎧 Falhla X Ssong live</span>
                <span class="arrow">◀</span>
            </a>
        </nav>

    </div>

</body>
</html>
